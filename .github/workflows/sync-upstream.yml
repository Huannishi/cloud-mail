name: Upstream Sync

permissions:
  contents: write
  actions: write

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream
        id: merge
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/maillab/cloud-mail.git || true
          git fetch --no-tags upstream main
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "commits_behind=$BEHIND"
          if [ "$BEHIND" = "0" ]; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
            exit 0
          fi
          git merge --no-edit upstream/main
          git push origin HEAD:main
          echo "new=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Cloudflare deploy
        if: steps.merge.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-cloudflare.yml -R "$GITHUB_REPOSITORY" --ref main
